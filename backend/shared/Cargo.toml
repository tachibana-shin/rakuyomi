[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[build-dependencies]
regex = "1.13.1"
schemars = { version = "1.2.3", features = ["url2"] }
size = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = { version = "2.5.8", features = ["serde"] }

[features]
default = ["all"]
all = ["sqlx"]
ffi = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = true, features = ["serde"] }
chrono-tz = "0.10.4"
num_enum = "0.7.6"
url = { version = "2.5.8", features = ["serde"] }
wasm_macros = { path = "../wasm_macros" }
wasm_shared = { path = "../wasm_shared" }
serde_json = "1.0.154"
html-escape = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "cookies",
  "deflate",
  "form",
  "gzip",
  "json",
  "query",
  "rustls-no-provider",
  "stream",
  "socks",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
ring = "0.17"
webpki-roots = "1"
semver = "1.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate", "bzip2"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
wasmi.workspace = true
futures = "0.3.34"
sqlx = { version = "0.9.0", optional = true, features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.21"
async-stream = "0.3.6"
tokio-util = "0.7.20"
tempfile = "3.27.0"
log = "0.4.34"
derive_more = { version = "2.1.1", features = ["from", "try_unwrap", "deref"] }
size = "0.6.0"
walkdir = "2.5.0"
regex = "1.13.1"
schemars = { version = "1.2.3", features = ["url2"] }
pared = { git = "https://github.com/hanatsumi/pared.git", branch = "feat/unwrap-or-clone" }
sanitize-filename = "0.6.0"
serde_json_lenient = "0.2.4"
futures-util = "0.3.34"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "0.11.1"
base64 = "0.23.1"
epub-builder = { git = "https://github.com/tachibana-shin/epub-builder.git", branch = "main" }
quick-xml = { version = "0.42.0", features = ["serialize"] }
image = { version = "0.25.10", default-features = false, features = [
  # Keep every format enabled by `default-formats` except `avif` (encoder
  # only; pulls ravif/rav1e) and `exr`, neither of which the plugin uses.
  "rayon",
  "bmp",
  "dds",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
] }
percent-encoding = "2.3.2"
once_cell = "1.21.4"
postcard = "1.1.3"
aidoku = { git = "https://github.com/Aidoku/aidoku-rs", branch = "main", default-features = false }
raqote = "0.8.5"
font-kit = "0.14.3"
imageproc = { version = "0.27.0", default-features = false, features = [
  # Only `drawing::draw_text_mut` is used; `default` would drag in the
  # `fft` and `image/default` (AVIF/EXR) features for nothing.
  "text",
] }
ab_glyph = "0.2.32"
markdown = "1.0.0"
unicode-normalization = "0.1.26"
ordered-float = "5.5.0"
dom_query = { version = "0.28.0", features = ["atomic"] }
d4rt_rs = "0.1.5"
rquickjs = { version = "0.14.0", features = ["futures", "bindgen"] }
dexvm = { version = "0.2.1", features = ["keiyoushi"] }
zune-png = "0.5.2"
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
mozjpeg = { version = "0.10.13", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["mount", "fs"] }
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
aes-gcm = "0.11.1"
md-5 = "0.11.0"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
pprof = { version = "0.15", features = ["flamegraph"] }
wat = "1.262.0"

[[bench]]
name = "chapter_downloader_benchmark"
harness = false

[[bench]]
name = "search_mangas_benchmark"
harness = false
