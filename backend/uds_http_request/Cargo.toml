[package]
name = "uds_http_request"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
http-body-util = "0.1.5"
hyper = { version = "1.12.0" }
hyper-util = "0.1.21"
hyperlocal = "0.9.1"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
