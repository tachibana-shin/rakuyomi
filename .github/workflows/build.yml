name: "Build"
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  luacheck:
    uses: ./.github/workflows/luacheck.yml
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    # The build matrix is expensive, so only start it after the tests pass:
    # the ci job runs the full test suite once for this workflow.
    needs: [ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: ["aarch64", "desktop", "kindle", "kindlehf", "kindlea9"]
        os: [ubuntu-latest]
        include:
          - target: "macos"
            os: macos-14
          # Android is split into parallel jobs, one per ABI: armv7 targets
          # API 18, aarch64/x86_64 target API 21.
          - target: "android-armv7"
            os: ubuntu-latest
            abi: "armv7"
          - target: "android-aarch64"
            os: ubuntu-latest
            abi: "aarch64"
          - target: "android-x86_64"
            os: ubuntu-latest
            abi: "x86_64"

    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "lts/*"

    - name: Install system deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev podman gettext
        echo "CROSS_CONTAINER_ENGINE=podman" >> $GITHUB_ENV

    - name: Install system deps (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gettext bash
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix bash)/bin" >> $GITHUB_PATH

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
 
    - name: Cache Podman images
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/containers
        key: ${{ runner.os }}-podman-cross-${{ matrix.target }}

    - name: Install Rust 1.97.1
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.97.1
        profile: minimal
        components: rustfmt, clippy
        override: true
    
    - name: Install macOS Rust Target
      if: matrix.target == 'macos'
      run: rustup target add aarch64-apple-darwin

    - name: Install cross (Linux)
      if: runner.os == 'Linux'
      run: cargo install cross

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        # bun.lock files use the v1 format (stable bun)
        bun-version: 1.3.14

    - name: Cache Rust Dependencies
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "backend -> target"
        prefix-key: "rust-cache-${{ matrix.target }}"

    - name: Install dependencies
      run: npm install
    - name: Get next version
      if: github.ref == 'refs/heads/main'
      run: npx semantic-release --dry-run
      id: get-next-version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build plugin
      run: |
        export SEMANTIC_RELEASE_VERSION="${{ steps.get-next-version.outputs.new-release-git-tag }}"
        # Using `--impure` here kinda sucks, but it's needed so that we can insert the `semantic-release`
        # version into the build.
        bash scripts/build-all.sh ${{ matrix.target }}
    - name: Package plugin contents
      run: "cd build && zip -r rakuyomi-${{ matrix.target }}.zip rakuyomi.koplugin"
    - name: Upload plugin as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }} build
        path: build/rakuyomi-${{ matrix.target }}.zip

    - uses: actions/setup-java@v4
      if: ${{ startsWith(matrix.target, 'android') }}
      with:
        distribution: temurin
        java-version: 17

    - uses: android-actions/setup-android@v3
      if: ${{ startsWith(matrix.target, 'android') }}

    - name: Install Android NDK (r23b)
      if: ${{ startsWith(matrix.target, 'android') }}
      run: sdkmanager "ndk;23.1.7779620"

    - name: Configure NDK
      if: ${{ startsWith(matrix.target, 'android') }}
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

    - name: Install cargo-ndk
      if: ${{ startsWith(matrix.target, 'android') }}
      run: cargo install cargo-ndk && rustup target install aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

    - name: Install clang for rquickjs bindgen
      if: ${{ startsWith(matrix.target, 'android') }}
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

    - name: Build plugin for android
      if: ${{ startsWith(matrix.target, 'android') }}
      run: bash scripts/build-rust-android.sh ${{ matrix.abi }}

  generate-settings-schema:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install system deps
      run: sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev podman gettext && echo "CROSS_CONTAINER_ENGINE=podman" >> $GITHUB_ENV

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
 
    - name: Install Rust 1.97.1
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.97.1
        profile: minimal
        components: rustfmt, clippy
        override: true

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        # bun.lock files use the v1 format (stable bun)
        bun-version: 1.3.14

    - name: Build settings schema
      run: bash scripts/generate-settings-schema.sh

    - name: Upload plugin as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: settings.schema.json
        path: build/settings.schema.json
  
  release:
    runs-on: ubuntu-latest
    needs: [build, generate-settings-schema]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: true
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "lts/*"
    - name: Install dependencies
      run: npm install
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: build
        merge-multiple: true
    - name: Combine android plugin zips
      run: |
        # The per-ABI android jobs all produce the same plugin zip (the
        # libserver.so lives in the companion app, not in the plugin), so
        # merge them back into a single rakuyomi-android.zip for release.
        if compgen -G "build/rakuyomi-android-*.zip" > /dev/null; then
          cp "$(ls build/rakuyomi-android-*.zip | head -1)" build/rakuyomi-android.zip
        fi
    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HUSKY: 0
      run: npx semantic-release
