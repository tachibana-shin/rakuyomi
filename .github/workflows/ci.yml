name: CI

on:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # bun.lock files use the v1 format (stable bun)
          bun-version: 1.3.14

      - name: Install Rust 1.97.1
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.97.1
          profile: minimal
          components: rustfmt, clippy
          override: true

      - name: Cargo fmt
        working-directory: ./backend
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: ./backend
        run: cargo clippy

      - name: Run tests
        working-directory: ./backend
        shell: bash
        run: |
          # Some integration tests hit the network and can be flaky; retry
          # the whole run up to 3 times before failing.
          for attempt in 1 2 3; do
            if cargo test --all; then
              exit 0
            fi
            echo "Test run $attempt/3 failed, retrying..."
          done
          echo "Test run failed after 3 attempts"
          exit 1

