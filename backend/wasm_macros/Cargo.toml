[package]
name = "wasm_macros"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }
wasm_shared = { path = "../wasm_shared" }
wasmi = "2.0.0"

[lib]
proc-macro = true
