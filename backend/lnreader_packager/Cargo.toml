[package]
name = "lnreader_packager"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
shared = { path = "../shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Holds the plugin JS handed to the metadata-extraction subprocess (see
# `package_plugin_js_with_timeout`) -- passed via a temp file rather than a
# CLI argument, which has OS-level length limits real plugin sources can
# exceed.
tempfile = "3.27.0"
# `plugins_index.rs`'s own minimal blocking client -- this crate has no
# Tokio runtime, so `shared::tls::client_builder()`'s async
# `reqwest::ClientBuilder` isn't usable here.
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "json",
  "rustls-no-provider",
] }
# `rustls-no-provider` above means reqwest won't auto-install a crypto
# provider; without one, building the client panics at runtime. `shared::tls`
# sidesteps this by handing reqwest a preconfigured `ClientConfig`, which
# isn't reachable from this crate's own minimal blocking client -- so this
# installs the process-wide default directly instead.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
