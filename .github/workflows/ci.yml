name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust 1.97.1
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.97.1
          profile: minimal
          components: rustfmt, clippy
          override: true

      - name: Cargo fmt
        working-directory: ./backend
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: ./backend
        run: cargo clippy

      - name: Run tests
        working-directory: ./backend
        run: cargo test --all

