name: Cookie Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "telegram-cookie-bot/**"
  pull_request:
    paths:
      - "telegram-cookie-bot/**"
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./telegram-cookie-bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build worker
        run: bun x wrangler deploy --dry-run --outdir dist

  # Deploys on every push to main. The job is skipped when the Cloudflare
  # credentials are not configured, so forks keep working without them.
  deploy:
    needs: check
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.CLOUDFLARE_API_TOKEN != '' &&
      secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./telegram-cookie-bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        run: bun x wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
