name: Debug Kindle Link

on:
  workflow_dispatch:
  push:
    branches:
      - fix/301-kindle-static-server

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
      - name: Install Rust 1.97.1
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.97.1
          profile: minimal
          components: rustfmt, clippy
          override: true
      - name: Install cross
        run: cargo install cross
      - name: Build server with verbose link
        working-directory: ./backend
        run: |
          export CROSS_CONTAINER_ENGINE=podman
          RUSTFLAGS="-C link-arg=-static -C link-arg=-latomic -C link-arg=-lgcc" \
            cross build --release --target arm-unknown-linux-musleabi -v 2>&1 | tail -200 | grep -B2 -A8 "link-arg" | tail -40
          echo "=== READELF ==="
          readelf -d target/arm-unknown-linux-musleabi/release/server | grep -E "NEEDED|INTERP" || echo "no NEEDED/INTERP"
